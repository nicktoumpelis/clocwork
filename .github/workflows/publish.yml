name: publish

# Uploads a GitHub release's wheel and sdist to PyPI through trusted
# publishing: PyPI accepts this workflow file running in the `pypi`
# environment, so no token is stored. The files are the ones attached to the
# release, uploaded as they are rather than rebuilt; attach the tests
# workflow's `dist` artifact from the tagged commit.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, such as v0.1.0
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  pypi:
    name: Upload the release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/clocwork/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the release's wheel and sdist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9][0-9A-Za-z.]*$ ]]; then echo "not a release tag: $TAG"; exit 1; fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist --pattern '*.whl' --pattern '*.tar.gz'
          version=${TAG#v}
          test -f "dist/clocwork-$version-py3-none-any.whl"
          test -f "dist/clocwork-$version.tar.gz"
          files=(dist/*)
          if [ "${#files[@]}" != 2 ]; then echo "expected only the wheel and the sdist in dist/:"; ls dist; exit 1; fi
          sha256sum dist/*
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
