[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clocwork"
description = "Lines per language, AI co-authored commits and token cost over a repository's whole history"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dynamic = ["version"]
authors = [{ name = "Nick Toumpelis" }]

[project.scripts]
clocwork = "clocwork.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["clocwork"]

[tool.setuptools.package-data]
clocwork = ["template.html"]

[tool.setuptools.dynamic]
version = { attr = "clocwork.__version__" }
